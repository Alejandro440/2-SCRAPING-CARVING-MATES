name: Análisis diario VWCE

on:
  schedule:
    # 05:30 UTC de lunes a viernes = 07:30 CEST, con el cierre del día anterior
    # ya consolidado y antes de la apertura de Xetra (09:00 CEST).
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar análisis
        run: python run_daily.py

      - name: Publicar informe (commit al repositorio)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "Informe diario VWCE $(date -u +%F)"
          git push
